<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Form Submit and PNG Export</title>
    <link rel="stylesheet" href="style.css">
    <!-- Include Google Fonts: Almendra SC -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Almendra SC" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <!-- Include html2canvas library from CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>
 <!-- Main HTML form wrapper -->
    <form id="myForm" action="https://your-api-endpoint.com" method="POST">
        
        <!-- Target module captured for transparent generation -->
        <div id="captureArea" class="form-container">
            
            <!-- Box 1: Dropdown Selection -->
            <div id="field-block-1" class="absolute-field">
                <select id="category" name="category" class="invisible-input" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="technology">Technology</option>
                    <option value="finance">Finance</option>
                    <option value="healthcare">Healthcare</option>
                </select>
            </div>

            <!-- Box 2: Dropdown Selection -->
            <div id="field-block-2" class="absolute-field">
                <select id="priority" name="priority" class="invisible-input form-select bi" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="low">&#xF424;</option>
                    <option value="medium">&#xF8E5;</option>
                    <option value="high">High</option>
                </select>
            </div>

            <!-- Box 3: Text Input -->
            <div id="field-block-3" class="absolute-field">
                <input type="text" id="username" name="username" class="invisible-input" required>
            </div>

        </div>

        <!-- The control button is linked seamlessly to the HTML form structure above -->
        <div class="control-panel">
            <button type="submit" id="submitBtn">Submit & Download Form</button>
        </div>
    </form>
<script src="https://cdn.jsdelivr.net/npm/jquery@3.5.1/dist/jquery.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-Fy6S3B9q64WdZWQUiU+q4/2Lc9npb8tCaSX9FK7E8HnRr0Jz8D6OP9dO5Vg3Q9ct" crossorigin="anonymous"></script>
</body>
</html>

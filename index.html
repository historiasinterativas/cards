<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Integrated Form Submit and PNG Export</title>
    
    <!-- Include Google Fonts: Almendra SC -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css?family=Almendra SC" rel="stylesheet" type="text/css">
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.5.0/font/bootstrap-icons.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">

    <!-- Include html2canvas library from CDN -->
    <script src="https://cloudflare.com"></script>
</head>
<body>

        <!-- Target module captured for transparent generation -->
        <div id="captureArea" class="form-container">
            
            <!-- Dropdown Selection -->
            <div id="people" class="absolute-field">
                <select id="people" name="people" class="invisible-input" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="duergor">duergor</option>
                    <option value="duerguelf">duerguelfe/duerguelf</option>
                    <option value="duergan">duergane/duergan</option>
                    <option value="duerorc">duerorque/duerorc</option>
                    <option value="elf">elfe/elf</option>
                    <option value="elfan">elfan/elfano</option>
                    <option value="human">humane/human</option>
                    <option value="orc">native/orc</option>
                    <option value="orcan">orcane/orcan</option>
                    <option value="orquelf">orquelfe/orquelf</option>
                    <option value="halfling">pequenine/halfling</option>
                </select>
            </div>
            <div id="combat" class="absolute-field">
                <select id="category" name="category" class="invisible-input" required>
                    <option value="" disabled selected hidden></option>  
                    <option value="melee">armas brancas/melee</option>
                    <option value="archery">arqueria/archery</option>
                    <option value="brawl">luta/brawl</option>
                </select>
            </div>
             <div id="devotion" class="absolute-field">
                <select id="devotion" name="devotion" class="invisible-input" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="deities">divindades/deities</option>
                    <option value="elements">elementos/elements</option>
                    <option value="xamanism">xamanismo/xamanism</option>
                    <option value="none">nenhuma/none</option>
                </select>
            </div>
            <div id="valor" class="absolute-field">
                <select id="valor" name="valor" class="invisible-input" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="low">Low</option>
                    <option value="medium">Medium</option>
                    <option value="high">High</option>
                </select>
            </div>
             <div id="desvalor" class="absolute-field">
                <select id="desvalor" name="desvalor" class="invisible-input" required>
                    <option value="" disabled selected hidden></option> 
                    <option value="one">um/one</option>
                    <option value="two">dois/two</option>
                    <option value="three">tres/three</option>
                </select>
            </div>

            <!-- Text Input -->
            <div id="nome" class="absolute-field">
                <input type="text" id="nome" name="nome" class="invisible-input" required>
            </div> 
            <div id="place" class="absolute-field">
                <input type="text" id="place" name="place" class="invisible-input" required>
            </div>
            <div id="other" class="absolute-field">
                <input type="text" id="other" name="other" class="invisible-input" required>
            </div>

             <!-- Radio Input -->
            <div id="range" class="absolute-field">
                <input type="radio" id="fixed" name="range" class="invisible-input" required>
                <input type="radio" id="roamer" name="range" class="invisible-input" required>
            </div>
        </div>
        <!-- The control button is linked seamlessly to the HTML form structure above -->
        <div class="control-panel">
             <button id="download-btn">Download Card</button>
        </div>
   
    <script src="script.js"></script>
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js" integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-ho+j7jyWK8fNQe+A12Hb8AhRq26LrZ/JpcUGGOn+Y7RsweNrtN/tE3MoK7ZeZDyx" crossorigin="anonymous"></script>
</body>
</html>
